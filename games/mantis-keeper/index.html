<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2f5d34" />
<title>カマキリ飼育日記 ― MANTIS KEEPER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="view"></canvas>

<!-- ふだんの画面 (ケースのお世話) -->
<div id="hud" class="hidden">
  <header id="top" class="panel">
    <div class="row">
      <b id="mName"></b><span id="mStage" class="chip"></span><span id="mSex" class="chip"></span>
      <span class="spacer"></span><span id="mDate"></span>
    </div>
    <div id="gauges">
      <div class="gauge" id="gHunger"><span>おなか</span><i><b></b></i></div>
      <div class="gauge" id="gMoist"><span>しめり気</span><i><em class="band"></em><b></b></i></div>
      <div class="gauge" id="gClean"><span>きれいさ</span><i><b></b></i></div>
      <div class="gauge" id="gHealth"><span>げんき</span><i><b></b></i></div>
    </div>
  </header>
  <div id="log" class="panel"></div>
  <nav id="actions">
    <button data-act="feed"><span>🦗</span><small>エサ</small></button>
    <button data-act="mist"><span>💧</span><small>霧吹き</small></button>
    <button data-act="clean"><span>🧻</span><small>そうじ</small></button>
    <button data-act="look"><span>🔍</span><small>観察</small></button>
    <button data-act="mate" class="pink hidden"><span>💕</span><small id="mateLabel"></small></button>
    <button data-act="watch" class="hidden"><span>🍂</span><small>見守る</small></button>
    <button data-act="next" class="next"><span>▶</span><small>3日すすめる</small></button>
  </nav>
</div>

<!-- 狩りの画面 -->
<div id="hunt" class="hidden">
  <div id="huntInfo" class="panel"></div>
  <nav id="huntBtns">
    <button id="huntQuit">やめる</button>
    <button id="mateNow" class="pink hidden">今だ！オスを入れる</button>
    <button id="strikeBtn">カマ！</button>
  </nav>
</div>

<div id="modal" class="hidden"><div class="card" id="modalCard"></div></div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="main.js"></script>
</body>
</html>
